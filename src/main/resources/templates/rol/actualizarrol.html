<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rapidos y Furiosos | Actualizar Rol </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>


<body>
<div class="container">
    <h1>Actualización de Rol</h1>
    <form th:action="@{/rol/actualizar/{id}(id=${listarol.codigo})}" method="post" th:object="${listarol}">
        <div class="col-6">
            <label for="txtCod" class="form-label">Código:</label>
            <input type="text" id="txtCod" name="txtCod" class="form-control" readonly th:field="*{codigo}" th:value="${listarol.codigo}">
        </div>
        <div class="col-6">
            <label for="txtNom" class="form-label">Nombre:</label>
            <input type="text" id="txtNom" name="txtNom" class="form-control" maxlength="40"
                   th:field="*{nombre}">
        </div>
        <div class="col-6">
            <label for="chkEst" class="form-label">Estado:</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="chkEst" name="chkEst" th:field="*{estado}">
                <label class="form-check-label" for="chkEst">
                    Habilitado
                </label>
            </div>
        </div>
        <button type="submit" class="btn btn-success">Actualizar</button>
        <a th:href="@{/rol/listar}" class="btn btn-dark">Regresar</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>


</html>
