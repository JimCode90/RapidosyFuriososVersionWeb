<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rapidos y Furiosos | Habilitar Empleado </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>


<body>
<div class="container">
    <h1>Listado de Empleados</h1>
    <a th:href="@{/empleado/listar}" class="btn btn-dark">Regresar</a>
    <div class="mb-3"></div>
    <!-- inicio de la tabla -->
    <div class="table-responsive">
        <table class="table table-striped table-hover table-bordered">
            <thead class="table-dark">
            <tr>
                <th scope="col">Código</th>
                <th scope="col">Nombre</th>
                <th scope="col">A. Paterno</th>
                <th scope="col">A. Materno</th>
                <th scope="col">Num. Documento</th>
                <th scope="col">Fec. Nacimiento</th>
                <th scope="col">Nacionalidad</th>
                <th scope="col">Dirección</th>
                <th scope="col">Teléfono</th>
                <th scope="col">Celular</th>
                <th scope="col">Correo</th>
                <th scope="col">Usuario</th>
                <th scope="col">Sueldo</th>
                <th scope="col">Distrito</th>
                <th scope="col">Sexo</th>
                <th scope="col">T. Documento</th>
                <th scope="col">Estado Civil</th>
                <th scope="col">Rol</th>
                <th scope="col">Estado</th>
                <th scope="col">Habilitar</th>
                <th scope="col">Deshabilitar</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp: ${listaempleado}">
                <th scope="row" th:text="${emp.codigo}"></th>
                <td th:text="${emp.nombre}"></td>
                <td th:text="${emp.apellidopaterno}"></td>
                <td th:text="${emp.apellidomaterno}"></td>
                <td th:text="${emp.numerodocumento}"></td>
                <td th:text="${emp.fechanacimiento}"></td>
                <td th:text="${emp.nacionalidad}"></td>
                <td th:text="${emp.direccion}"></td>
                <td th:text="${emp.telefono}"></td>
                <td th:text="${emp.celular}"></td>
                <td th:text="${emp.correo}"></td>
                <td th:text="${emp.usuario}"></td>
                <td th:text="${emp.sueldo}"></td>
                <td th:text="${emp.distrito.nombre}"></td>
                <td th:text="${emp.sexo.nombre}"></td>
                <td th:text="${emp.tipodocumento.nombre}"></td>
                <td th:text="${emp.estadocivil.nombre}"></td>
                <td th:text="${emp.rol.nombre}"></td>
                <td th:text="${emp.estado ? 'Habilitado' : 'Deshabilitado'}"></td>
                <td><a th:href="@{/empleado/habilitar/{id}(id=${emp.codigo})}" class="btn btn-warning">Seleccionar</a></td>
                <td><a th:href="@{/empleado/deshabilitar/{id}(id=${emp.codigo})}" class="btn btn-danger">Seleccionar</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <!-- fin de la tabla -->
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>


</html>
