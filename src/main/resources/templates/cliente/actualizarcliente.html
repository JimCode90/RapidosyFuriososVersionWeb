<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rapidos y Furiosos | Actualizar Cliente </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <h1>Actualización de Cliente</h1>
    <form th:action="@{/cliente/actualizar/{id}(id=${listacliente.codigo})}" method="post" th:object="${listacliente}">
        <div class="row">
            <div class="col-6">
                <label for="txtCod" class="form-label">Código:</label>
                <input type="text" id="txtCod" name="txtCod" class="form-control" readonly th:field="*{codigo}">
            </div>
            <div class="col-6">
                <label for="txtNom" class="form-label">Nombre:</label>
                <input type="text" id="txtNom" name="txtNom" class="form-control" th:field="*{nombre}">
            </div>
            <div class="col-6">
                <label for="txtApep" class="form-label">Apellido Paterno:</label>
                <input type="text" id="txtApep" name="txtApep" class="form-control" th:field="*{apellidopaterno}">
            </div>
            <div class="col-6">
                <label for="txtApem" class="form-label">Apellido Materno:</label>
                <input type="text" id="txtApem" name="txtApem" class="form-control" th:field="*{apellidomaterno}">
            </div>
            <div class="col-6">
                <label for="cboTipoDocumento" class="form-label">Tipo de Documento:</label>
                <select class="form-select" id="cboTipoDocumento" name="cboTipoDocumento" required th:field="*{tipodocumento}">
                    <option value="0">Seleccione un tipo de documento</option>
                    <option th:each="td: ${listatipodocumento}" th:value="${td.codigo}" th:text="${td.nombre}"></option>
                </select>
            </div>
            <div class="col-6">
                <label for="txtNumDoc" class="form-label">Numero de Documento:</label>
                <input type="text" id="txtNumDoc" name="txtNumDoc" class="form-control" th:field="*{numerodocumento}">
            </div>
            <div class="col-6">
                <label for="txtFec" class="form-label">Fecha de Nacimiento:</label>
                <input type="date" id="txtFec" name="txtFec" class="form-control" th:field="*{fechanacimiento}">
            </div>
            <div class="col-6">
                <label for="txtNac" class="form-label">Nacionalidad:</label>
                <input type="text" id="txtNac" name="txtNac" class="form-control"
                       th:field="*{nacionalidad}">
            </div>
            <div class="col-6">
                <label for="txtNom" class="form-label">Dirección:</label>
                <textarea class="form-control" id="txtDir" name="txtDir" th:field="*{direccion}"></textarea>
            </div>
            <div class="col-6">
                <label for="cboDistrito" class="form-label">Distrito:</label>
                <select class="form-select" id="cboDistrito" name="cboDistrito" required th:field="*{distrito}">
                    <option value="0">Seleccione un distrito</option>
                    <option th:each="dis: ${listadistrito}" th:value="${dis.codigo}" th:text="${dis.nombre}"></option>
                </select>
            </div>
            <div class="col-6">
                <label for="txtTel" class="form-label">Teléfono:</label>
                <input type="text" id="txtTel" name="txtTel" class="form-control" th:field="*{telefono}">
            </div>
            <div class="col-6">
                <label for="txtCel" class="form-label">Celular:</label>
                <input type="text" id="txtCel" name="txtCel" class="form-control" th:field="*{celular}">
            </div>
            <div class="col-6">
                <label for="txtCor" class="form-label">Correo:</label>
                <input type="text" id="txtCor" name="txtNtxtCorom" class="form-control" th:field="*{correo}">
            </div>
            <div class="col-6">
                <label for="cboSexo" class="form-label">Sexo:</label>
                <select class="form-select" id="cboSexo" name="cboSexo" required th:field="*{sexo}">
                    <option value="0">Seleccione un sexo</option>
                    <option th:each="sex: ${listasexo}" th:value="${sex.codigo}" th:text="${sex.nombre}"></option>
                </select>
            </div>
            <div class="col-6">
                <label for="chkEst" class="form-label">Estado:</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="chkEst" name="chkEst" th:field="*{estado}">
                    <label class="form-check-label" for="chkEst">
                        Habilitado
                    </label>
                </div>
            </div>
        </div>
        <div class="mb-3"></div>
        <button type="submit" class="btn btn-success">Actualizar</button>
        <a th:href="@{/cliente/listar}" class="btn btn-dark">Regresar</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
